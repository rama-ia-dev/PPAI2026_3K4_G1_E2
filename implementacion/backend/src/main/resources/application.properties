spring.application.name=bolsines-cu36
# La API simulada del GPS Tracker (implementacion/api-gps-tracker) usa el puerto 8080; este backend usa el 8081
server.port=8081

# ---------- Base de datos (H2 en archivo). ddl-auto=create: el esquema se recrea en cada arranque ----------
spring.datasource.url=jdbc:h2:file:./data/bolsinesdb;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jackson.serialization.write-dates-as-timestamps=false

# ---------- Claves de la API simulada del GPS Tracker (una por modelo) ----------
